openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HomeOS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bills
    description: Household bills management
  - name: expenses
    description: Expense tracking
  - name: subscriptions
    description: Subscription management
  - name: assets
    description: Home asset management
  - name: documents
    description: Document vault
  - name: dashboard
    description: Dashboard summary and analytics
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Bills ───────────────────────────────────────────────────────────────────
  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List all bills
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a new bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillInput"
      responses:
        "201":
          description: Created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get a bill by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Update a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillUpdate"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Expenses ────────────────────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Subscriptions ───────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Assets ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all home assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a new asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get an asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Documents ───────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload/create a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/{id}/query:
    post:
      operationId: queryDocument
      tags: [documents]
      summary: Ask an AI question about a document (RAG)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentQueryInput"
      responses:
        "200":
          description: AI answer with source citation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentQueryResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get active alerts for the home
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardAlert"

  /dashboard/upcoming:
    get:
      operationId: getDashboardUpcoming
      tags: [dashboard]
      summary: Get upcoming due items (bills, warranties, services, subscriptions)
      responses:
        "200":
          description: List of upcoming items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingItem"

  # ─── OpenAI ──────────────────────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── Bills ─────────────────────────────────────────────────────────────────
    Bill:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        provider:
          type: string
        category:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        billingPeriod:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - category
        - amount
        - dueDate
        - status
        - createdAt
        - updatedAt

    BillInput:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        category:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        billingPeriod:
          type: string
        status:
          type: string
      required:
        - name
        - provider
        - category
        - amount
        - dueDate
        - status

    BillUpdate:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        category:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        billingPeriod:
          type: string
        status:
          type: string

    # ─── Expenses ──────────────────────────────────────────────────────────────
    Expense:
      type: object
      properties:
        id:
          type: number
        description:
          type: string
        amount:
          type: number
        category:
          type: string
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - description
        - amount
        - category
        - date
        - createdAt

    ExpenseInput:
      type: object
      properties:
        description:
          type: string
        amount:
          type: number
        category:
          type: string
        date:
          type: string
          format: date
      required:
        - description
        - amount
        - category
        - date

    # ─── Subscriptions ─────────────────────────────────────────────────────────
    Subscription:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        provider:
          type: string
        amount:
          type: number
        frequency:
          type: string
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
        usageLevel:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - amount
        - frequency
        - nextBillingDate
        - status
        - usageLevel
        - createdAt
        - updatedAt

    SubscriptionInput:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        amount:
          type: number
        frequency:
          type: string
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
        usageLevel:
          type: string
      required:
        - name
        - provider
        - amount
        - frequency
        - nextBillingDate
        - status
        - usageLevel

    SubscriptionUpdate:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        amount:
          type: number
        frequency:
          type: string
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
        usageLevel:
          type: string

    # ─── Assets ────────────────────────────────────────────────────────────────
    Asset:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        category:
          type: string
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchasePrice:
          type: ["number", "null"]
        serialNumber:
          type: ["string", "null"]
        warrantyExpiryDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
        lastServiceDate:
          type: ["string", "null"]
          format: date
        nextServiceDate:
          type: ["string", "null"]
          format: date
        failureProbability:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - status
        - createdAt
        - updatedAt

    AssetInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        serialNumber:
          type: string
        warrantyExpiryDate:
          type: string
          format: date
        status:
          type: string
        lastServiceDate:
          type: string
          format: date
        nextServiceDate:
          type: string
          format: date
        notes:
          type: string
      required:
        - name
        - category
        - status

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        serialNumber:
          type: string
        warrantyExpiryDate:
          type: string
          format: date
        status:
          type: string
        lastServiceDate:
          type: string
          format: date
        nextServiceDate:
          type: string
          format: date
        failureProbability:
          type: number
        notes:
          type: string

    # ─── Documents ─────────────────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
        content:
          type: string
        summary:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - content
        - tags
        - createdAt

    DocumentInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - type
        - content
        - tags

    DocumentQueryInput:
      type: object
      properties:
        question:
          type: string
      required:
        - question

    DocumentQueryResult:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
      required:
        - answer
        - sources

    # ─── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalMonthlyExpenses:
          type: number
        totalBills:
          type: number
        pendingBills:
          type: number
        totalAssets:
          type: number
        warningAssets:
          type: number
        totalDocuments:
          type: number
        totalSubscriptions:
          type: number
        monthlySubscriptionCost:
          type: number
        expensesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"
      required:
        - totalMonthlyExpenses
        - totalBills
        - pendingBills
        - totalAssets
        - warningAssets
        - totalDocuments
        - totalSubscriptions
        - monthlySubscriptionCost
        - expensesByCategory

    CategoryTotal:
      type: object
      properties:
        category:
          type: string
        total:
          type: number
      required:
        - category
        - total

    DashboardAlert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        entity:
          type: string
        entityId:
          type: ["number", "null"]
      required:
        - id
        - type
        - message
        - entity

    UpcomingItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        dueDate:
          type: string
        daysUntil:
          type: number
        amount:
          type: ["number", "null"]
      required:
        - id
        - type
        - name
        - dueDate
        - daysUntil

    # ─── OpenAI ────────────────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: number
        conversationId:
          type: number
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
